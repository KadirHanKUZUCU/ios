name: Build iOS IPA for Sideloadly

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Manuel olarak GitHub sitesinden de "Run workflow" butonuyla tetiklenebilir

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest # En güncel ve desteklenen Apple Silicon macOS Runner (Ücretsiz)

    steps:
      - name: 📥 Depoyu İndir
        uses: actions/checkout@v4

      - name: 🟢 Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 NPM Bağımlılıklarını Yükle
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 📱 Expo Prebuild ile iOS Projesini Oluştur
        run: npx expo prebuild --platform ios --clean

      - name: 💎 Ruby Ortamını Hazırla
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: 🧩 iOS MessageFilter & CallKit Extension Hedeflerini Xcode Projesine Ekle
        run: |
          gem install xcodeproj --no-document
          ruby scripts/add_ios_extensions.rb 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: ☕ CocoaPods Bağımlılıklarını Kur
        run: |
          cd ios
          pod install --repo-update

      - name: 🔨 Xcode ile İzasız .app Derlemesi Yap
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace SpamFilter.xcworkspace \
            -scheme SpamFilter \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "../build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log || {
              echo "❌ Xcode derlemesi başarısız oldu! İşte son 100 satır hata kaydı:"
              tail -n 100 xcodebuild.log
              exit 1
            }

      - name: 📦 Sideloadly Uyumlu .IPA Paketini Paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpamFilter.app Payload/
          echo "=== Paket İçi Eklentiler (PlugIns) Listesi ==="
          ls -la Payload/SpamFilter.app/PlugIns
          test -d Payload/SpamFilter.app/PlugIns/MessageFilterExtension.appex || { echo "❌ MessageFilterExtension.appex eksik!"; exit 1; }
          test -d Payload/SpamFilter.app/PlugIns/CallDirectoryExtension.appex || { echo "❌ CallDirectoryExtension.appex eksik!"; exit 1; }
          zip -r -9 SpamFilter.ipa Payload
          ls -la SpamFilter.ipa

      - name: 🚀 IPA Dosyasını İndirmeye Hazırla (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SpamFilter-IPA
          path: SpamFilter.ipa
          retention-days: 7

